<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <title>源泉徴収税 給与 簡易計算（日本）</title>

<body class="bg-gray-100 min-h-screen">
  <header class="bg-rose-700 text-white px-6 py-4">
    <h1 class="text-xl font-bold">源泉徴収税 給与 簡易計算（日本）</h1>
    <p class="text-sm text-rose-200 mt-1">国税庁源泉徴収税額表（令和6年版）に基づく概算計算</p>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 flex flex-col gap-6">

    <!-- モード選択 -->
    <div class="bg-white rounded-xl shadow p-4 flex gap-4 items-center">
      <span class="text-sm font-medium text-gray-700">計算モード:</span>
      <label class="flex items-center gap-1 cursor-pointer text-sm">
        <input type="radio" name="mode" value="monthly" checked id="mode-monthly" class="accent-rose-600" />
        <span>月額給与</span>
      </label>
      <label class="flex items-center gap-1 cursor-pointer text-sm">
        <input type="radio" name="mode" value="bonus" id="mode-bonus" class="accent-rose-600" />
        <span>賞与</span>
      </label>
    </div>

    <!-- 月額モード -->
    <div id="panel-monthly" class="flex flex-col gap-4">
      <div class="bg-white rounded-xl shadow p-5 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-3">
          <h2 class="font-semibold text-gray-700">給与情報入力</h2>

          <div class="flex flex-col gap-1">
            <label class="text-sm font-medium text-gray-700" for="f-taxable">課税対象額（月額・社保控除後）<span class="text-red-500">*</span></label>
            <div class="flex items-center gap-2">
              <input id="f-taxable" type="number" min="0" step="1000" class="border border-gray-300 rounded px-3 py-2 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-rose-500" placeholder="例: 300000" aria-required="true" />
              <span class="text-sm text-gray-500">円</span>
            </div>
            <p class="text-xs text-gray-400">月額給与 − 社会保険料（健保・厚年・雇用）</p>
          </div>

          <div class="flex flex-col gap-1">
            <label class="text-sm font-medium text-gray-700" for="f-dependents">扶養親族等の数</label>
            <select id="f-dependents" class="border border-gray-300 rounded px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-rose-500">
              <option value="0">0人</option>
              <option value="1">1人</option>
              <option value="2">2人</option>
              <option value="3">3人</option>
              <option value="4">4人</option>
              <option value="5">5人</option>
              <option value="6">6人</option>
              <option value="7">7人（以上）</option>
            </select>
          </div>

            <select id="f-kukan" class="border border-gray-300 rounded px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-rose-500">
              <option value="ko">甲欄（主たる給与・扶養控除申告書提出あり）</option>
              <option value="otsu">乙欄（従たる給与・申告書提出なし）</option>
            </select>
          </div>

          <div class="flex flex-col gap-1">
            <label class="text-sm font-medium text-gray-700" for="f-social-ins">社会保険料（月額・参考入力）</label>

              <span class="text-sm text-gray-500">円</span>
            </div>
          </div>

          <button id="btn-calc" class="mt-2 px-4 py-2 bg-rose-600 text-white rounded hover:bg-rose-700 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm" aria-label="計算する">計算する</button>

            <p class="text-gray-400 text-sm">左に金額を入力して「計算する」ボタンを押してください</p>
          </div>
        </div>
      </div>

    // 扶養控除の差引額（甲欄・概算：扶養1人あたり月3,800円相当の控除を反映）
    // 実際の表では扶養数ごとに差し引き額が変わる
    function lookupKo(taxable, deps) {
      const d = Math.min(deps, 7);
      // 扶養1人あたり約38,000円×1/12≒3,167円の差引効果（概算）
      const deduction = d * 3167;
      const adjusted = Math.max(0, taxable - deduction);
      // 501,000円超は別計算
      if (adjusted >= 501000) {
        // 高額給与: 概算 (adjusted * 0.23 - 638636) + 2.1%
        const base = adjusted * 0.23 - 63636;
        return Math.max(0, Math.round(base));
      }
      for (const row of KO_TABLE) {
        if (adjusted >= row[0] && adjusted < row[1]) {
          return row[2][0]; // 扶養0人の額（調整済）
        }
      }
      return 0;
    }

    function lookupOtsu(taxable) {
      // 乙欄: 概算税率（扶養控除なし・高め）
      if (taxable < 89000) return Math.round(taxable * 0.03);
      if (taxable < 300000) return Math.round(taxable * 0.08 - 4000);
      if (taxable < 600000) return Math.round(taxable * 0.10 - 10000);
      return Math.round(taxable * 0.20 - 70000);
    }

    // 賞与税率表（甲欄概算・前月給与基準）
    const BONUS_RATE_TABLE = [
      [0, 68000, 0],
      [68000, 79000, 0.026],
      [79000, 252000, 0.0422],
      [252000, 300000, 0.0840],
      [300000, 334000, 0.0921],
      [334000, 363000, 0.0961],
      [363000, 394000, 0.1040],
      [394000, 467000, 0.1121],
      [467000, 500000, 0.1161],
      [500000, 600000, 0.1301],
      [600000, 700000, 0.1681],
      [700000, 900000, 0.1841],
      [900000, 1000000, 0.1921],
    ];

    function bonusRate(prevMonthly, deps) {
      const deduction = Math.min(deps, 5) * 3167;
      const adj = Math.max(0, prevMonthly - deduction);
      for (const row of BONUS_RATE_TABLE) {
        if (adj >= row[0] && adj < row[1]) return row[2];
      }
      return 0.2042;
    }

    function fmt(n) { return Math.floor(n).toLocaleString('ja-JP'); }

    function makeCard(label, value, colorClass) {
      const div = document.createElement('div');
      div.className = 'rounded-lg border p-3 flex flex-col gap-1 ' + (colorClass || 'border-gray-200 bg-gray-50');
      const p1 = document.createElement('p');
      p1.textContent = label;
      p1.className = 'text-xs text-gray-500';
      const p2 = document.createElement('p');
      p2.textContent = value;
      p2.className = 'text-base font-bold text-gray-800';
      div.appendChild(p1);
      div.appendChild(p2);
      return div;
    }

    document.getElementById('btn-calc').addEventListener('click', () => {
      const taxable = parseInt(document.getElementById('f-taxable').value, 10);
      const deps = parseInt(document.getElementById('f-dependents').value, 10);
      const kukan = document.getElementById('f-kukan').value;
      const socialIns = parseInt(document.getElementById('f-social-ins').value, 10) || 0;

      if (isNaN(taxable) || taxable < 0) {
        document.getElementById('result-panel').innerHTML = '';
        const p = document.createElement('p');
        p.textContent = '課税対象額を正しく入力してください';
        p.className = 'text-red-600 text-sm';
        document.getElementById('result-panel').appendChild(p);
        return;
      }

      let withholding;
      if (kukan === 'ko') {
        withholding = lookupKo(taxable, deps);
      } else {
        withholding = lookupOtsu(taxable);
      }
      // 復興特別所得税: 2.1%
      const fukko = Math.round(withholding * 0.021);
      const totalWithholding = withholding + fukko;
      const netSalary = taxable - totalWithholding - socialIns;

      const panel = document.getElementById('result-panel');
      while (panel.firstChild) panel.removeChild(panel.firstChild);

      panel.appendChild(makeCard('課税対象額', fmt(taxable) + ' 円', 'border-gray-200 bg-gray-50'));
      panel.appendChild(makeCard('源泉所得税（概算）', fmt(withholding) + ' 円', 'border-rose-200 bg-rose-50'));
      panel.appendChild(makeCard('復興特別所得税（2.1%）', fmt(fukko) + ' 円', 'border-orange-200 bg-orange-50'));
      panel.appendChild(makeCard('所得税合計', fmt(totalWithholding) + ' 円', 'border-red-200 bg-red-50'));
      if (socialIns > 0) {
        panel.appendChild(makeCard('社会保険料（入力値）', fmt(socialIns) + ' 円', 'border-blue-200 bg-blue-50'));
        panel.appendChild(makeCard('手取り概算', fmt(Math.max(0, netSalary)) + ' 円', 'border-green-200 bg-green-50'));
      }

      // 年間推計
      const annualPanel = document.getElementById('annual-panel');
      const annualContent = document.getElementById('annual-content');
      while (annualContent.firstChild) annualContent.removeChild(annualContent.firstChild);
      annualContent.appendChild(makeCard('年間課税額', fmt(taxable * 12) + ' 円'));
      annualContent.appendChild(makeCard('年間源泉所得税', fmt(totalWithholding * 12) + ' 円', 'border-rose-200 bg-rose-50'));
      if (socialIns > 0) {
        annualContent.appendChild(makeCard('年間社保', fmt(socialIns * 12) + ' 円', 'border-blue-200 bg-blue-50'));
        annualContent.appendChild(makeCard('年間手取概算', fmt(Math.max(0, netSalary) * 12) + ' 円', 'border-green-200 bg-green-50'));
      }
      annualPanel.classList.remove('hidden');

      save();
    });

    document.getElementById('btn-calc-bonus').addEventListener('click', () => {
      const bonusAmt = parseInt(document.getElementById('f-bonus-amount').value, 10);
      const prevMonthly = parseInt(document.getElementById('f-prev-monthly').value, 10);
      const deps = parseInt(document.getElementById('f-bonus-deps').value, 10);

      const panel = document.getElementById('bonus-result');
      while (panel.firstChild) panel.removeChild(panel.firstChild);

      if (isNaN(bonusAmt) || bonusAmt <= 0 || isNaN(prevMonthly) || prevMonthly <= 0) {
        const p = document.createElement('p');
        p.textContent = '賞与金額と前月給与を正しく入力してください';
        p.className = 'text-red-600 text-sm';
        panel.appendChild(p);
        return;
      }

      const rate = bonusRate(prevMonthly, deps);
      const withholding = Math.round(bonusAmt * rate);
      const fukko = Math.round(withholding * 0.021);
      const total = withholding + fukko;

      panel.appendChild(makeCard('賞与額', fmt(bonusAmt) + ' 円'));
      panel.appendChild(makeCard('適用税率', (rate * 100).toFixed(2) + '%', 'border-gray-200 bg-gray-50'));
      panel.appendChild(makeCard('源泉所得税（概算）', fmt(withholding) + ' 円', 'border-rose-200 bg-rose-50'));
      panel.appendChild(makeCard('復興特別所得税', fmt(fukko) + ' 円', 'border-orange-200 bg-orange-50'));
      panel.appendChild(makeCard('控除合計', fmt(total) + ' 円', 'border-red-200 bg-red-50'));
      panel.appendChild(makeCard('手取り概算', fmt(bonusAmt - total) + ' 円', 'border-green-200 bg-green-50'));

      save();
    });

    // mode switch
    document.querySelectorAll('input[name="mode"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const isBonus = document.getElementById('mode-bonus').checked;
        document.getElementById('panel-monthly').classList.toggle('hidden', isBonus);
        document.getElementById('panel-bonus').classList.toggle('hidden', !isBonus);
      });
    });

    function save() {
      const data = {
        taxable: document.getElementById('f-taxable').value,
        deps: document.getElementById('f-dependents').value,
        kukan: document.getElementById('f-kukan').value,
        social: document.getElementById('f-social-ins').value,
        bonusAmt: document.getElementById('f-bonus-amount').value,
        prevMonthly: document.getElementById('f-prev-monthly').value,
        bonusDeps: document.getElementById('f-bonus-deps').value,
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const data = JSON.parse(saved);
        if (data.taxable) document.getElementById('f-taxable').value = data.taxable;
        if (data.deps) document.getElementById('f-dependents').value = data.deps;
        if (data.kukan) document.getElementById('f-kukan').value = data.kukan;
        if (data.social) document.getElementById('f-social-ins').value = data.social;
        if (data.bonusAmt) document.getElementById('f-bonus-amount').value = data.bonusAmt;
        if (data.prevMonthly) document.getElementById('f-prev-monthly').value = data.prevMonthly;
        if (data.bonusDeps) document.getElementById('f-bonus-deps').value = data.bonusDeps;
      } catch {}
    }
  </script>
</body>
</html>
